<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pincelada Anatômica — Portal do Mentorado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<!--DADOS-->
<script>
/* Modelo fixo do portal. Os dados de cada cliente ficam em dados.js. */
const D = window.DADOS || {};
const CONFIG = {
  mentorado: (D.cliente || {}).mentorado || '', empresa: (D.cliente || {}).empresa || '', mentor: (D.cliente || {}).mentor || '',
  tipo: (D.cliente || {}).tipo || 'produtos', primeiroEncontro: (D.cliente || {}).primeiroEncontro || '',
  cores: (D.cliente || {}).cores || { escuro: '#17181D', claro: '#F6F3EE', claro2: '#ECE6DC', destaque: '#B8894A', destaqueTexto: '#835C28' },
  endpoint: D.endpoint || '',
  perspectivas: (D.aplicacao || {}).caminhos || [], formatos: (D.aplicacao || {}).formatos || [],
  doMentor: D.mentor || {}, briefing: D.briefing || { extras: [], remover: [] }, apresentacao: D.apresentacao || { liberada: false }, aplicacao: D.aplicacao || { liberada: false }
};
</script>
<style>
  :root { --escuro:#17181D; --claro:#F6F3EE; --claro2:#ECE6DC; --destaque:#B8894A; --destaque-texto:#835C28; --texto:#4A4A52; --linha:#D9D1C3; --branco:#FCFBF8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--claro); color:var(--escuro); font-family:'DM Sans', Arial, sans-serif; font-size:16px; line-height:1.5; }
  h1,h2,.serif { font-family:'Cormorant Garamond', Georgia, serif; font-weight:600; }
  a { color:inherit; }
  header.topo { background:var(--escuro); color:var(--claro); padding:28px 24px 20px; }
  .topo-in { max-width:1080px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--destaque-texto); }
  header .eyebrow { color:var(--destaque); }
  header h1 { margin:6px 0 0; font-size:34px; line-height:1.1; }
  .salvo { font-size:13px; color:#CFCBC3; }

  nav.fluxo { background:var(--escuro); padding:8px 24px 28px; overflow-x:auto; }
  .fluxo-in { max-width:1080px; margin:0 auto; display:flex; gap:12px; min-width:760px; }
  .mov { flex:1; border:1px solid #33343B; border-radius:12px; padding:12px 12px 14px; }
  .mov-nome { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#A9A59D; margin-bottom:10px; }
  .nos { display:flex; align-items:flex-start; }
  .no { flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer; background:none; border:0; color:var(--claro); padding:0; font:inherit; position:relative; }
  .no::after { content:""; position:absolute; top:22px; left:calc(50% + 24px); right:calc(-50% + 24px); height:2px; background:#3A3B42; }
  .no:last-child::after { display:none; }
  .circ { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; border:2px solid #4A4B53; background:var(--escuro); position:relative; z-index:1; }
  .no.andamento .circ { border-color:var(--destaque); color:var(--destaque); }
  .no.feita .circ { background:var(--destaque); border-color:var(--destaque); color:var(--escuro); }
  .no.ativa .circ { box-shadow:0 0 0 4px rgba(184,137,74,.35); }
  .no-nome { font-size:12.5px; margin-top:8px; line-height:1.25; }
  .no-pct { font-size:11px; color:#A9A59D; }
  .no.ativa .no-nome { font-weight:700; }
  .resumo-btn { align-self:center; flex:0 0 auto; background:none; border:1px solid var(--destaque); color:var(--destaque); border-radius:999px; padding:10px 16px; font:inherit; font-weight:700; font-size:13px; cursor:pointer; }

  main { max-width:900px; margin:0 auto; padding:40px 24px 80px; }
  .etapa-cab h1 { font-size:48px; margin:6px 0 8px; line-height:1.05; }
  .etapa-cab .num { color:var(--destaque); }
  .objetivo { font-size:19px; color:var(--texto); margin:0 0 18px; }
  .legenda { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px; font-size:13px; color:var(--texto); align-items:center; }
  .barra-geral { display:flex; align-items:center; gap:12px; margin-bottom:22px; font-size:13px; color:var(--texto); }
  .barra { flex:1; height:6px; background:var(--claro2); border-radius:6px; overflow:hidden; }
  .barra > div { height:100%; background:var(--destaque); width:0; transition:width .3s; }

  details.modulo { background:var(--branco); border:1px solid var(--linha); border-radius:16px; margin-bottom:14px; }
  details.modulo > summary { list-style:none; cursor:pointer; padding:20px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  details.modulo > summary::-webkit-details-marker { display:none; }
  .mod-tit { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; font-weight:600; line-height:1.1; }
  .mod-num { color:var(--destaque-texto); }
  .mod-pct { font-size:13px; color:var(--texto); white-space:nowrap; }
  .seta { display:inline-block; transition:transform .2s; margin-left:8px; }
  details[open] .seta { transform:rotate(90deg); }
  .mod-corpo { padding:0 24px 24px; }
  .teoria { background:var(--claro2); border-radius:12px; padding:14px 18px; margin-bottom:22px; font-size:14.5px; color:var(--texto); }
  .teoria p { margin:0 0 6px; }
  .teoria p:last-child { margin:0; }
  .teoria b { color:var(--escuro); }

  .campo { margin-bottom:22px; }
  .lbl { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; font-weight:700; font-size:15px; margin-bottom:8px; }
  .dica { font-size:13.5px; color:var(--texto); margin:-4px 0 8px; }
  .badge { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .badge.P { background:var(--claro2); color:var(--escuro); }
  .badge.J { background:var(--destaque); color:var(--escuro); }
  .badge.M { background:var(--escuro); color:var(--claro); }
  .sub { font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; font-weight:600; margin:28px 0 12px; padding-top:18px; border-top:1px solid var(--linha); }
  input[type=text], textarea, select { width:100%; font:inherit; font-size:15px; color:var(--escuro); background:var(--claro); border:1px solid var(--linha); border-radius:10px; padding:10px 12px; }
  textarea { min-height:88px; resize:vertical; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--destaque); outline-offset:1px; border-color:var(--destaque); }
  .lista { display:grid; gap:8px; }
  .lista.c3 { grid-template-columns:repeat(3,1fr); }
  .lista.c2 { grid-template-columns:repeat(2,1fr); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--linha); background:var(--claro); border-radius:999px; padding:8px 14px; cursor:pointer; font:inherit; font-size:14px; color:var(--escuro); }
  .chip.on { background:var(--escuro); color:var(--claro); border-color:var(--escuro); }
  .slider { display:flex; align-items:center; gap:14px; }
  .slider input { flex:1; accent-color:var(--destaque); }
  .slider .val { font-family:'Cormorant Garamond', Georgia, serif; font-size:30px; font-weight:700; color:var(--destaque-texto); min-width:44px; text-align:right; }
  .grade { width:100%; border-collapse:separate; border-spacing:0 8px; }
  .grade th { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--destaque-texto); text-align:left; padding:0 6px; font-weight:700; }
  .grade td { padding:0 6px; vertical-align:top; }
  .grade td.rot { font-weight:700; font-size:14px; padding-top:10px; white-space:nowrap; }
  .linha-card { border:1px solid var(--linha); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--claro); display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .linha-card .full { grid-column:1 / -1; }
  .linha-card label { display:block; font-size:12.5px; font-weight:700; color:var(--texto); margin-bottom:4px; }
  .linha-card input, .linha-card textarea { background:var(--branco); }
  .linha-card textarea { min-height:60px; }
  .linha-card .n { grid-column:1 / -1; font-weight:700; font-size:14px; }
  .preparo { border:1px solid var(--linha, #e5dccd); border-radius:16px; padding:26px 28px; background:var(--branco); margin-top:18px; }
  .preparo .status { display:inline-flex; align-items:center; gap:10px; font-weight:600; font-size:15px; margin-bottom:18px; }
  .preparo .pulso { width:10px; height:10px; border-radius:50%; background:var(--ouro, #b8892d); animation:pulso 1.4s ease-in-out infinite; }
  @keyframes pulso { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.7); } }
  .preparo ol { list-style:none; margin:0; padding:0; }
  .preparo li { display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--linha, #eee6d8); font-size:15px; }
  .preparo li:first-child { border-top:0; }
  .preparo .ic { flex:0 0 26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; border:1.5px solid #cbbfa9; color:#8a7d66; }
  .preparo li.feito .ic { background:var(--escuro); border-color:var(--escuro); color:#fff; }
  .preparo li.agora .ic { border-color:var(--ouro, #b8892d); color:var(--ouro, #b8892d); }
  .preparo li.agora b { color:var(--escuro); }
  .preparo li span small { display:block; color:#7a705f; font-size:13.5px; margin-top:2px; }
  .preparo .msg { margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--claro, #f4efe6); font-size:14.5px; }
  @media (prefers-reduced-motion: reduce) { .preparo .pulso { animation:none; } }
  .mentor { border:1px dashed var(--escuro); border-radius:12px; padding:14px 18px; background:var(--branco); }
  .mentor ul { margin:6px 0 0; padding-left:20px; }
  .mentor li { margin-bottom:4px; font-size:14.5px; }
  .mentor .vazio { font-size:14px; }
  .tag-prop { font-size:12px; font-weight:500; color:var(--texto); }
  .prop-texto { white-space:pre-wrap; font-size:15.5px; margin:6px 0 0; }
  .prop-porque { margin-top:10px; background:var(--claro2); border-radius:10px; padding:10px 14px; font-size:14px; color:var(--texto); white-space:pre-wrap; }
  .prop-porque b { color:var(--escuro); }
  .blocos { margin:8px 0 0; padding-left:20px; }
  .blocos li { margin-bottom:6px; font-size:14.5px; white-space:pre-wrap; }
  .guerra { border-top:1px solid var(--linha); padding-top:10px; margin-top:10px; }
  .guerra p { margin:4px 0 0; font-size:14.5px; }
  .sugestao { background:var(--claro2); border-radius:10px; padding:12px 16px; font-size:14.5px; color:var(--texto); margin-top:4px; }
  .sugestao b { color:var(--escuro); }
  .card-persp { border:1px solid var(--linha); border-radius:12px; padding:16px; margin-bottom:12px; background:var(--claro); }
  .card-persp.escolhido { border:2px solid var(--destaque); }
  .card-persp h3 { margin:0 0 10px; font-size:17px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .card-persp label.mini { display:block; font-size:12.5px; font-weight:700; color:var(--texto); margin-bottom:4px; }
  .card-persp textarea { min-height:60px; background:var(--branco); }
  .card-persp input[type=text] { background:var(--branco); }
  .escolher { font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .total { font-weight:700; color:var(--destaque-texto); }

  .acoes { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; align-items:center; }
  .btn { font:inherit; font-weight:700; font-size:14.5px; border-radius:999px; padding:12px 20px; cursor:pointer; border:1px solid var(--escuro); background:var(--escuro); color:var(--claro); text-decoration:none; display:inline-block; }
  .btn.sec { background:transparent; color:var(--escuro); }
  .btn.ouro { background:var(--destaque); border-color:var(--destaque); color:var(--escuro); }
  .espaco { flex:1; }
  .aviso { font-size:13px; color:var(--texto); margin-top:10px; }
  .boas h1 { font-size:52px; margin:8px 0 12px; line-height:1.05; }
  .res-bloco { background:var(--branco); border:1px solid var(--linha); border-radius:14px; padding:20px 24px; margin-bottom:14px; }
  .res-bloco h3 { margin:0 0 10px; font-size:18px; }
  .res-linha { font-size:14.5px; margin:0 0 8px; color:var(--texto); white-space:pre-wrap; }
  .res-linha b { color:var(--escuro); }
  .vazio { color:#8A857C; font-style:italic; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--escuro); color:var(--claro); padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }

  nav.abas { background:var(--escuro); border-top:1px solid #2A2B31; }
  .abas-in { max-width:1080px; margin:0 auto; display:flex; gap:6px; padding:10px 24px; overflow-x:auto; }
  .aba { color:#CFCBC3; text-decoration:none; font-size:14px; font-weight:700; padding:9px 16px; border-radius:999px; white-space:nowrap; border:1px solid transparent; }
  .aba .n { color:var(--destaque); margin-right:6px; }
  .aba.on { background:var(--claro); color:var(--escuro); }
  .aba.on .n { color:var(--destaque-texto); }
  .aba:not(.on):hover { border-color:#4A4B53; }
  nav.fluxo[hidden] { display:none; }
  main.largo { max-width:1180px; }
  .palco { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:14px; box-shadow:0 1px 0 var(--linha); background:var(--escuro); }
  .palco-in { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  .palco-in { line-height:1.2; font-size:32px; color:var(--escuro); }
  .palco-in * { margin:0; }
  .palco-in > section { width:1920px; height:1080px; box-sizing:border-box; position:relative; overflow:hidden; }
  .palco-in table { width:100%; border-collapse:collapse; }
  .palco-in p, .palco-in h1, .palco-in h2, .palco-in h3, .palco-in td, .palco-in th { overflow-wrap:break-word; }
  .controles { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; }
  .contador { font-size:14px; color:var(--texto); min-width:70px; text-align:center; }
  .miniaturas { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  .mini-dot { width:10px; height:10px; border-radius:50%; background:var(--linha); border:0; padding:0; cursor:pointer; }
  .mini-dot.on { background:var(--destaque); }
  .portal-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:28px 0; }
  .pcard { background:var(--branco); border:1px solid var(--linha); border-radius:16px; padding:22px; text-decoration:none; color:inherit; display:flex; flex-direction:column; gap:8px; }
  .pcard:hover { border-color:var(--destaque); }
  .pcard .n { font-family:'Cormorant Garamond', Georgia, serif; font-size:40px; font-weight:700; color:var(--destaque-texto); line-height:1; }
  .pcard h3 { margin:0; font-size:19px; }
  .pcard p { margin:0; color:var(--texto); font-size:14.5px; }
  .pcard .pct { font-size:13px; font-weight:700; color:var(--destaque-texto); }
  .parte { background:var(--branco); border:1px solid var(--linha); border-radius:16px; padding:22px 24px; margin-bottom:14px; }
  .parte h2 { margin:0 0 14px; font-size:26px; }
  @media (max-width:640px) { .portal-cards { grid-template-columns:1fr; } .palco { border-radius:10px; } }
  @media (max-width:640px) {
    .lista.c3, .lista.c2, .passos, .duo, .linha-card { grid-template-columns:1fr; }
    .etapa-cab h1, .boas h1 { font-size:38px; }
    details.modulo > summary, .mod-corpo { padding-left:16px; padding-right:16px; }
    .grade, .grade tbody, .grade tr, .grade td { display:block; width:100%; }
    .grade thead { display:none; }
    .grade tr { margin-bottom:12px; }
    .grade td { padding:3px 0; }
  }
.palco-in section {
  --escuro: #17181D;      
  --claro: #F6F3EE;       
  --claro2: #ECE6DC;      
  --destaque: #B8894A;    
  --destaque-texto: #835C28; 
  --texto: #4A4A52;       
  --texto-claro: #CFCBC3; 
}
.palco-in section {
  padding: 128px 128px 160px;
  background: var(--claro);
  color: var(--escuro);
  font-family: 'DM Sans', Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.palco-in section.escuro { background: var(--escuro); color: var(--claro); }
.palco-in section.alt { background: var(--claro2); }
.palco-in section.cor { background: var(--destaque); color: var(--escuro); }
.palco-in h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 132px; font-weight: 600; line-height: 1.0; margin: 0; }
.palco-in h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 80px; font-weight: 600; line-height: 1.05; margin: 0; }
.palco-in h3 { font-size: 32px; font-weight: 700; margin: 0; line-height: 1.2; }
.palco-in p { font-size: 28px; line-height: 1.45; margin: 0; color: var(--texto); }
.palco-in section.escuro p { color: var(--texto-claro); }
.palco-in section.cor p { color: var(--escuro); }
.palco-in p.eyebrow { font-size: 24px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--destaque-texto); margin-bottom: 28px; }
.palco-in section.escuro p.eyebrow { color: var(--destaque); }
.palco-in section.cor p.eyebrow { color: var(--escuro); }
.palco-in p.lead { font-size: 32px; line-height: 1.45; max-width: 1180px; margin-top: 40px; }
.palco-in p.tese { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 96px; font-weight: 600; line-height: 1.08; color: var(--escuro); max-width: 1500px; }
.palco-in section.escuro p.tese { color: var(--claro); }
.palco-in .rodape { position: absolute; left: 128px; bottom: 64px; width: 1664px; display: flex; justify-content: space-between; }
.palco-in .rodape p { font-size: 24px; color: var(--texto); }
.palco-in section.escuro .rodape p { color: var(--texto-claro); }
.palco-in .capa-topo { flex: 1; }
.palco-in .capa-linha { width: 120px; height: 4px; background: var(--destaque); margin: 48px 0; }
.palco-in .cols { display: flex; gap: 40px; margin-top: 64px; }
.palco-in .col { flex: 1; display: flex; flex-direction: column; gap: 20px; border-top: 3px solid var(--destaque); padding-top: 28px; }
.palco-in .col p { font-size: 26px; }
.palco-in .col .passo { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; font-weight: 600; color: var(--destaque); line-height: 1; }
.palco-in .mini { border: 2px solid var(--claro2); background: var(--claro); border-radius: 12px; padding: 20px 24px; }
.palco-in section.alt .mini { border-color: #D9D1C3; }
.palco-in .mini p { font-size: 24px; line-height: 1.35; }
.palco-in .mini h3 { font-size: 28px; }
.palco-in .etapa { display: grid; grid-template-columns: 600px 1fr; gap: 96px; flex: 1; }
.palco-in .etapa-esq { display: flex; flex-direction: column; }
.palco-in .etapa-esq .num { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 200px; font-weight: 600; line-height: 0.9; color: var(--destaque); margin-bottom: 24px; }
.palco-in .etapa-esq p.obj { margin-top: 32px; font-size: 30px; }
.palco-in .etapa-dir { display: flex; flex-direction: column; gap: 40px; justify-content: center; }
.palco-in .bloco { border-top: 2px solid var(--destaque); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.palco-in .bloco p { font-size: 26px; }
.palco-in .bloco h3 { font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--destaque-texto); }
.palco-in .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 44px; }
.palco-in .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 44px; }
.palco-in .mod { border: 2px solid #D9D1C3; border-radius: 14px; padding: 24px 28px; display: flex; flex-direction: column; gap: 8px; background: #FCFBF8; }
.palco-in .mod h3 { font-size: 30px; margin-bottom: 4px; }
.palco-in .mod p { font-size: 24px; line-height: 1.35; }

  const SLIDES_PADRAO = ["<section id=\"capa\" class=\"escuro\" data-transition=\"fade\">\n<div class=\"capa-topo\">\n<p class=\"eyebrow\">Mentoria · Método Pincelada Anatômica</p>\n<h1>[Nome da empresa]</h1>\n<div class=\"capa-linha\"></div>\n<p class=\"lead\">Plano de mentoria preparado para [Nome do mentorado]: da leitura da essência à marca pronta para o mercado.</p>\n</div>\n<div class=\"rodape\"><p>[Seu nome] · Mentor</p><p>[Mês e ano]</p></div>\n\n</section>", "<section id=\"tese\">\n<p class=\"eyebrow\">A tese do método</p>\n<p class=\"tese\">Todo negócio forte carrega a pincelada de quem o conduz. E pincelada não se copia.</p>\n<p class=\"lead\">Antes de posicionar a sua empresa, vamos entender quem está por trás dela: suas virtudes, habilidades e dons. É dessa matéria-prima que nasce um posicionamento que nenhum concorrente consegue imitar.</p>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>2</p></div>\n</section>", "<section id=\"jornada\" class=\"alt\">\n<p class=\"eyebrow\">Como funciona</p>\n<h2>Três movimentos, sete etapas, oito semanas</h2>\n<div class=\"cols\">\n<div class=\"col\">\n<h3>Ler a essência</h3>\n<div class=\"mini\"><h3>01 · Imersão</h3><p>Leitura da essência · Semana 1</p></div>\n<div class=\"mini\"><h3>02 · Tradução</h3><p>Da essência ao negócio · Semana 2</p></div>\n</div>\n<div class=\"col\">\n<h3>Construir a ponte</h3>\n<div class=\"mini\"><h3>03 · Fundamentos</h3><p>Os 3 pilares em conceito · Semana 3</p></div>\n<div class=\"mini\"><h3>04 · Mapa de Lacunas</h3><p>Gargalos prioritários · Semana 4</p></div>\n<div class=\"mini\"><h3>05 · Perspectivas</h3><p>Caminhos do seu ramo · Semana 4</p></div>\n</div>\n<div class=\"col\">\n<h3>Empacotar para o mercado</h3>\n<div class=\"mini\"><h3>06 · Empacotamento</h3><p>Os 3 pilares aplicados · Semanas 5 a 7</p></div>\n<div class=\"mini\"><h3>07 · Rota de Receita</h3><p>Indicadores e rotina · Semana 8</p></div>\n</div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>3</p></div>\n</section>", "<section id=\"metodo\">\n<p class=\"eyebrow\">O método</p>\n<h2>Cada módulo segue o mesmo ciclo</h2>\n<div class=\"cols\">\n<div class=\"col\"><p class=\"passo\">1</p><h3>Conceito</h3><p>O que você precisa entender antes de agir.</p></div>\n<div class=\"col\"><p class=\"passo\">2</p><h3>Estudo</h3><p>A base que sustenta o conceito: autores, pesquisas, dados de mercado e casos reais.</p></div>\n<div class=\"col\"><p class=\"passo\">3</p><h3>Aplicação</h3><p>O exercício feito sobre o seu negócio, não sobre um exemplo genérico.</p></div>\n<div class=\"col\"><p class=\"passo\">4</p><h3>Entrega</h3><p>O que fica pronto ao fim do módulo.</p></div>\n</div>\n<p class=\"nota\">Em cada ficha está marcado quem preenche: o mentor, você, ou nós dois juntos no encontro.</p>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>4</p></div>\n</section>", "<section id=\"inicio\">\n<p class=\"eyebrow\">Antes do primeiro encontro</p>\n<h2>Tudo começa com uma leitura profunda</h2>\n<div class=\"cols\">\n<div class=\"col\"><p class=\"passo\">1</p><h3>Briefing</h3><p>Você responde 20 perguntas sobre você, o seu negócio, os seus clientes e o seu mercado.</p></div>\n<div class=\"col\"><p class=\"passo\">2</p><h3>Diagnóstico</h3><p>Em até 7 dias, eu entrego a leitura completa e o planejamento estratégico feito para a sua empresa.</p></div>\n<div class=\"col\"><p class=\"passo\">3</p><h3>Aplicação</h3><p>Começam os 2 meses de mentoria: etapa por etapa, aplicando junto comigo.</p></div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>5</p></div>\n</section>", "<section id=\"estudo\" class=\"alt\">\n<p class=\"eyebrow\">Nos 7 dias depois do briefing</p>\n<h2>Como eu estudo o seu negócio</h2>\n<div class=\"cols\">\n<div class=\"col\"><p class=\"passo\">1</p><h3>Leitura</h3><p>Suas respostas viram hipóteses sobre você e sobre o negócio.</p></div>\n<div class=\"col\"><p class=\"passo\">2</p><h3>Dados</h3><p>Procura, concorrência e tendências do seu ramo, sempre com a fonte.</p></div>\n<div class=\"col\"><p class=\"passo\">3</p><h3>Referências</h3><p>Casos que já deram certo: um local, um nacional e um de fora do ramo.</p></div>\n<div class=\"col\"><p class=\"passo\">4</p><h3>Direção</h3><p>A rota feita para você: onde aprofundar e o que aplicar primeiro.</p></div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>6</p></div>\n</section>", "<section id=\"diagnostico\" class=\"alt\">\n<p class=\"eyebrow\">O seu ponto de partida</p>\n<h2>O que o diagnóstico revelou</h2>\n<div class=\"cols\">\n<div class=\"col\"><h3>Retrato de Essência</h3><p>{{retrato}}</p></div>\n<div class=\"col\"><h3>Tese de Valor</h3><p>{{tese}}</p></div>\n<div class=\"col\"><h3>Lacunas prioritárias</h3><p>{{lacunas}}</p></div>\n<div class=\"col\"><h3>Direção recomendada</h3><p>{{direcao}}</p></div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>7</p></div>\n\n</section>", "<section id=\"etapa1\">\n<div class=\"etapa\">\n<div class=\"etapa-esq\">\n<p class=\"eyebrow\">Ler a essência · Semana 1</p>\n<p class=\"num\">01</p>\n<h2>Imersão</h2>\n<p class=\"obj\">Entender quem você é antes de olhar para a empresa.</p>\n</div>\n<div class=\"etapa-dir\">\n<div class=\"bloco\"><h3>O que vamos trabalhar</h3><p>Sua fase de vida, sua forma de agir e de decidir, suas virtudes, habilidades e dons, o que te trava e até onde você pode chegar.</p></div>\n<div class=\"bloco\"><h3>Você vai preencher</h3><p>Mapa de Essência</p></div>\n<div class=\"bloco\"><h3>Você recebe</h3><p>Retrato de Essência: a definição do diferencial que só você tem.</p></div>\n</div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>8</p></div>\n</section>", "<section id=\"e1m\">\n<p class=\"eyebrow\">01 · Imersão</p>\n<h2>Os 4 módulos da Imersão</h2>\n<div class=\"grid2\">\n<div class=\"mod\"><h3>1.1 · Fase de vida</h3><p><span class=\"rot\">Conceito</span> A estratégia certa depende da sua fase.</p><p><span class=\"rot\">Base</span> Leitura dos marcos da sua trajetória</p><p><span class=\"rot\">Você aplica</span> Linha do Tempo da Vida</p></div>\n<div class=\"mod\"><h3>1.2 · Forças e dons</h3><p><span class=\"rot\">Conceito</span> Talento desenvolvido rende mais.</p><p><span class=\"rot\">Base</span> Forças de Caráter VIA e Janela de Johari</p><p><span class=\"rot\">Você aplica</span> Teste VIA e Pesquisa dos 5</p></div>\n<div class=\"mod\"><h3>1.3 · Crenças que limitam</h3><p><span class=\"rot\">Conceito</span> Crenças automáticas decidem por você.</p><p><span class=\"rot\">Base</span> Beck, Dweck, Bandura e o impostor</p><p><span class=\"rot\">Você aplica</span> Mapa de Crenças</p></div>\n<div class=\"mod\"><h3>1.4 · Propósito</h3><p><span class=\"rot\">Conceito</span> Sentido é talento encontrando necessidade.</p><p><span class=\"rot\">Base</span> Ikigai</p><p><span class=\"rot\">Você aplica</span> Propósito e Visão de 3 anos</p></div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>9</p></div>\n</section>", "<section id=\"crencas\" class=\"escuro\">\n<p class=\"eyebrow\">Módulo 1.3</p>\n<h2>O inconsciente também decide</h2>\n<p class=\"lead\">Muitas decisões nascem de crenças formadas cedo e nunca questionadas. Elas viram inseguranças que impedem de cobrar mais, aparecer e crescer.</p>\n<div class=\"cols\">\n<div class=\"col\"><h3>Crenças centrais</h3><p class=\"autor\">Aaron Beck</p><p>Pensamentos automáticos nascem do que acreditamos sobre nós mesmos.</p></div>\n<div class=\"col\"><h3>Fenômeno do impostor</h3><p class=\"autor\">Clance e Imes, 1978</p><p>Pessoas competentes que se sentem uma fraude.</p></div>\n<div class=\"col\"><h3>Mentalidade de crescimento</h3><p class=\"autor\">Carol Dweck, 2006</p><p>Habilidade se desenvolve; não é algo fixo.</p></div>\n<div class=\"col\"><h3>Autoeficácia</h3><p class=\"autor\">Albert Bandura, 1977</p><p>Acreditar na própria capacidade muda o resultado.</p></div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>10</p></div>\n</section>", "<section id=\"etapa2\">\n<div class=\"etapa\">\n<div class=\"etapa-esq\">\n<p class=\"eyebrow\">Ler a essência · Semana 2</p>\n<p class=\"num\">02</p>\n<h2>Tradução</h2>\n<p class=\"obj\">Transformar o que você tem de melhor em vantagem para o seu negócio.</p>\n</div>\n<div class=\"etapa-dir\">\n<div class=\"bloco\"><h3>O que vamos trabalhar</h3><p>Onde a sua essência já aparece no negócio, onde está escondida e onde está sendo desperdiçada.</p></div>\n<div class=\"bloco\"><h3>Você vai preencher</h3><p>Ponte Essência → Negócio</p></div>\n<div class=\"bloco\"><h3>Você recebe</h3><p>Tese de Valor: a frase que explica por que escolhem você.</p></div>\n</div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>11</p></div>\n</section>", "<section id=\"e2m\">\n<p class=\"eyebrow\">02 · Tradução</p>\n<h2>Os 4 módulos da Tradução</h2>\n<div class=\"grid2\">\n<div class=\"mod\"><h3>2.1 · Porquê, como e o quê</h3><p><span class=\"rot\">Conceito</span> As pessoas compram primeiro o porquê.</p><p><span class=\"rot\">Base</span> Círculo Dourado, de Simon Sinek</p><p><span class=\"rot\">Você aplica</span> O Círculo Dourado do seu negócio</p></div>\n<div class=\"mod\"><h3>2.2 · Raio-X do negócio</h3><p><span class=\"rot\">Conceito</span> Poucos produtos geram a maior parte do lucro.</p><p><span class=\"rot\">Base</span> Curva ABC</p><p><span class=\"rot\">Você aplica</span> Tabela de produtos e produto-herói</p></div>\n<div class=\"mod\"><h3>2.3 · Proposta de valor</h3><p><span class=\"rot\">Conceito</span> O cliente contrata uma solução.</p><p><span class=\"rot\">Base</span> Canvas da Proposta de Valor</p><p><span class=\"rot\">Você aplica</span> Dores, ganhos e soluções</p></div>\n<div class=\"mod\"><h3>2.4 · A ponte</h3><p><span class=\"rot\">Conceito</span> Essência vale quando o cliente percebe.</p><p><span class=\"rot\">Base</span> Ponte Essência → Negócio</p><p><span class=\"rot\">Você aplica</span> Tese de Valor</p></div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>12</p></div>\n</section>", "<section id=\"etapa3\">\n<div class=\"etapa\">\n<div class=\"etapa-esq\">\n<p class=\"eyebrow\">Construir a ponte · Semana 3</p>\n<p class=\"num\">03</p>\n<h2>Fundamentos</h2>\n<p class=\"obj\">Entender os três pilares antes de executar qualquer coisa.</p>\n</div>\n<div class=\"etapa-dir\">\n<div class=\"bloco\"><h3>O que vamos trabalhar</h3><p>Posicionamento, copy e distribuição: o que são, como funcionam e por que o seu negócio precisa de cada um.</p></div>\n<div class=\"bloco\"><h3>Você vai preencher</h3><p>Autodiagnóstico dos Pilares</p></div>\n<div class=\"bloco\"><h3>Você recebe</h3><p>Sua nota de 0 a 10 em cada pilar, com a justificativa de cada nota.</p></div>\n</div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>13</p></div>\n</section>", "<section id=\"pilares\" class=\"escuro\">\n<p class=\"eyebrow\">Os três pilares</p>\n<h2>Como a sua essência chega ao mercado</h2>\n<div class=\"cols\">\n<div class=\"col\"><p class=\"passo\">I</p><h3>Posicionamento</h3><p>O lugar que a sua marca ocupa na mente do cliente. É o que faz você ser lembrado, e não comparado por preço.</p></div>\n<div class=\"col\"><p class=\"passo\">II</p><h3>Copy</h3><p>A palavra que vende. É como a sua essência vira mensagem, promessa e convite para comprar.</p></div>\n<div class=\"col\"><p class=\"passo\">III</p><h3>Distribuição</h3><p>Como a mensagem chega às pessoas certas: pelo orgânico (conteúdo, relacionamento, indicação) e pelo pago (anúncios).</p></div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>14</p></div>\n</section>", "<section id=\"e3m\">\n<p class=\"eyebrow\">03 · Fundamentos</p>\n<h2>O que você vai dominar em cada pilar</h2>\n<div class=\"grid3\">\n<div class=\"mod\"><h3>3.1 · Posicionamento</h3><p><span class=\"rot\">Base</span> Ries e Trout, diferenciação, preço e valor percebido</p><p><span class=\"rot\">Você aplica</span> O mapa de posições dos seus concorrentes</p></div>\n<div class=\"mod\"><h3>3.2 · Copy</h3><p><span class=\"rot\">Base</span> Copy em Camadas, níveis de consciência e Cialdini</p><p><span class=\"rot\">Você aplica</span> Reescrever um conteúdo seu com método</p></div>\n<div class=\"mod\"><h3>3.3 · Distribuição</h3><p><span class=\"rot\">Base</span> Funil, demanda ativa e latente, sinais das plataformas</p><p><span class=\"rot\">Você aplica</span> O mapa dos seus canais no funil</p></div>\n</div>\n<p class=\"nota\">Entrega da etapa: Autodiagnóstico dos Pilares, com nota de 0 a 10 e justificativa em cada um.</p>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>15</p></div>\n</section>", "<section id=\"etapa4\">\n<div class=\"etapa\">\n<div class=\"etapa-esq\">\n<p class=\"eyebrow\">Construir a ponte · Semana 4</p>\n<p class=\"num\">04</p>\n<h2>Mapa de Lacunas</h2>\n<p class=\"obj\">Descobrir exatamente o que falta, para agir com precisão e não fazer tudo ao mesmo tempo.</p>\n</div>\n<div class=\"etapa-dir\">\n<div class=\"bloco\"><h3>O que vamos trabalhar</h3><p>Os gargalos de atração, conversão, atendimento, entrega e recompra, e o que já funciona e não precisa ser refeito.</p></div>\n<div class=\"bloco\"><h3>Você vai preencher</h3><p>Matriz de Lacunas</p></div>\n<div class=\"bloco\"><h3>Você recebe</h3><p>As 3 lacunas prioritárias que vão comandar a aplicação.</p></div>\n</div>\n</div>\n<div class=\"rodape\"><p>Pincelada Anatômica · [Nome da empresa]</p><p>16</p></div>\n</section>", "<section id=\"e4m\">\n<p class=\"eyebrow\">04 · Mapa de Lacunas</p>\n<h2>Medir antes de agir</h2>\n<div class=\"grid3\">\n<div class=\"mod\"><h3>4.1 · Auditoria</h3><p><span class=\"rot\">O mentor analisa</span> Instagram, Google, site, WhatsApp e anúncios</p><p><span class=\"rot\">Você recebe</span> Relatório de         el('ol', {}, passos.map(([t, d, e], i) => el('li', { class: e }, el('span', { class: 'ic' }, e === 'feito' ? '✓' : String(i + 1)), el('span', {}, el('b', {}, t), d ? el('small', {}, d) : '')))),
        el('div', { class: 'msg' }, msg)),
      botao || '');
  }
  const SLIDES = (Array.isArray(C.apresentacao.slides) && C.apresentacao.slides.length) ? C.apresentacao.slides : SLIDES_PADRAO;
  let slideAtual = 0;
  function telaApresentacao() {
    if (!C.apresentacao.liberada) {
      const ok = pctBriefing() >= 100;
      return preparo('Parte 2', 'Sua apresentação', 'A apresentação e o planejamento estratégico são criados só para você, a partir das respostas do seu briefing.',
        ok ? 'Mentor criando sua apresentação e seu planejamento estratégico' : 'Aguardando o seu briefing',
        [['Briefing respondido', ok ? 'Recebido. Obrigado pelas respostas.' : 'Responda todas as perguntas para o mentor começar.', ok ? 'feito' : 'agora'],
         ['Mentor estudando suas respostas', 'Leitura da sua trajetória, do seu negócio e do seu público.', ok ? 'feito' : ''],
         ['Mentor criando a apresentação e o planejamento estratégico', 'Posicionamento, caminhos e direção pensados para o seu caso.', ok ? 'agora' : ''],
         ['Apresentação liberada para você', 'Ela aparece aqui, nesta aba.', '']],
        ok ? 'Você receberá uma mensagem assim que a sua apresentação estiver pronta.' : 'Assim que o briefing estiver completo, o mentor começa a preparar a sua apresentação.',
        ok ? '' : el('div', { class: 'acoes' }, el('a', { class: 'btn ouro', href: '#briefing' }, 'Responder o briefing →')));
    }
    const inner = el('div', { class: 'palco-in' });
    const palco = el('div', { class: 'palco', role: 'region', 'aria-label': 'Apresentação da mentoria' }, inner);
    const cont = el('span', { class: 'contador' });
    const dots = el('div', { class: 'miniaturas' });
    function escala() { const w = palco.clientWidth; if (w) inner.style.transform = `scale(${w / 1920})`; }
    function mostrarSlide(i) {
      slideAtual = Math.max(0, Math.min(SLIDES.length - 1, i));
      inner.innerHTML = trocar(SLIDES[slideAtual]);
      const sec = inner.firstElementChild;
      if (sec) { sec.style.setProperty('--escuro', C.cores.escuro); sec.style.setProperty('--claro', C.cores.claro); sec.style.setProperty('--claro2', C.cores.claro2); sec.style.setProperty('--destaque', C.cores.destaque); sec.style.setProperty('--destaque-texto', C.cores.destaqueTexto); }
      cont.textContent = (slideAtual + 1) + ' / ' + SLIDES.length;
      dots.querySelectorAll('.mini-dot').forEach((d, j) => d.classList.toggle('on', j === slideAtual));
      escala();
    }
    SLIDES.forEach((_, j) => dots.append(el('button', { class: 'mini-dot', type: 'button', 'aria-label': 'Slide ' + (j + 1), onclick: () => mostrarSlide(j) })));
    const wrap = el('div', {},
      el('div', { class: 'etapa-cab' }, el('div', { class: 'eyebrow' }, 'Parte 2'), el('h1', {}, 'O que vamos construir juntos'),
        el('p', { class: 'objetivo' }, 'A apresentação completa da sua mentoria. Use as setas para avançar.')),
      palco,
      el('div', { class: 'controles' },
        el('button', { class: 'btn sec', type: 'button', onclick: () => mostrarSlide(slideAtual - 1) }, '← Anterior'),
        cont,
        el('button', { class: 'btn', type: 'button', onclick: () => mostrarSlide(slideAtual + 1) }, 'Próximo →')),
      dots,
      el('div', { class: 'acoes', style: 'justify-content:center' }, el('a', { class: 'btn ouro', href: '#etapa-1' }, 'Seguir para a aplicação →')));
    teclado = e => { if (e.key === 'ArrowRight') mostrarSlide(slideAtual + 1); if (e.key === 'ArrowLeft') mostrarSlide(slideAtual - 1); };
    setTimeout(() => { mostrarSlide(slideAtual); if (window.ResizeObserver) new ResizeObserver(escala).observe(palco); }, 0);
    return wrap;
  }
  let teclado = null;
  document.addEventListener('keydown', e => { if (teclado && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) teclado(e); });
  function telaBriefing() {
    return el('div', {},
      el('div', { class: 'etapa-cab' }, el('div', { class: 'eyebrow' }, 'Parte 1' + (C.briefing.subtitulo ? ' · ' + C.briefing.subtitulo : '')), el('h1', {}, C.briefing.titulo || 'Briefing'),
        (C.briefing.introducao ? String(C.briefing.introducao).split(/\n\s*\n/) : ['O ponto de partida de tudo. Com as suas respostas, eu estudo o seu negócio e preparo a sua apresentação e o seu planejamento. Leva cerca de 30 minutos; números podem ser aproximados.']).map(t => el('p', { class: 'objetivo' }, t))),
      el('div', { class: 'barra-geral' }, el('div', { class: 'barra' }, el('div', { id: 'barraBriefing', style: `width:${pctBriefing()}%` })), el('span', { id: 'pctBriefing' }, pctBriefing() + '% respondido')),
      perguntasBriefing().map(([parte, qs], pi) => el('div', { class: 'parte' }, el('h2', {}, Array.isArray(C.briefing.perguntas) && C.briefing.perguntas.length && /^\d/.test(parte) ? parte : `${pi + 1} · ${parte}`),
        qs.map(x => el('div', { class: 'campo' }, el('div', { class: 'lbl' }, rotuloQ(x)), x.dica ? el('p', { class: 'dica', style: 'white-space:pre-wrap' }, x.dica) : '', entrada(x.k, '', true, x.q))))),
      C.briefing.titulo ? '' : el('p', { class: 'aviso' }, 'Os prints do Instagram e o logo da marca você me entrega no primeiro encontro.'),
      el('div', { class: 'acoes' }, el('span', { class: 'espaco' }), el('a', { class: 'btn ouro', href: '#apresentacao' }, 'Concluir briefing →')));
  }

  /* ---------- telas ---------- */
  function telaInicio() {
    const pa = Math.round(STAGES.reduce((t, s) => t + pct(s), 0) / STAGES.length);
    return el('div', { class: 'boas' },
      el('div', { class: 'eyebrow' }, 'Seu portal de mentoria'),
      el('h1', {}, 'Olá, ' + C.mentorado + '.'),
      el('p', { class: 'objetivo' }, 'Tudo da sua mentoria em um só lugar. Primeiro o seu briefing; com ele eu preparo a sua apresentação; depois vem a aplicação, etapa por etapa.'),
      el('div', { class: 'portal-cards' },
        el('a', { class: 'pcard', href: '#briefing' }, el('span', { class: 'n' }, '1'), el('h3', {}, 'Briefing'), el('p', {}, 'As perguntas que dão início a tudo. Comece por aqui.'), el('span', { class: 'pct' }, pctBriefing() + '% respondido')),
        el('a', { class: 'pcard', href: '#apresentacao' }, el('span', { class: 'n' }, '2'), el('h3', {}, 'Apresentação'), el('p', {}, 'O que vamos construir para você, montado a partir do seu briefing.'), el('span', { class: 'pct' }, C.apresentacao.liberada ? 'Disponível' : 'Em preparação')),
        el('a', { class: 'pcard', href: '#etapa-1' }, el('span', { class: 'n' }, '3'), el('h3', {}, 'Aplicação'), el('p', {}, 'As fichas de cada etapa, preenchidas ao longo dos 2 meses.'), el('span', { class: 'pct' }, C.aplicacao.liberada ? pa + '% preenchido' : 'Em preparação'))),
      el('div', { class: 'legenda' }, 'Na aplicação, cada campo mostra quem preenche:', badge('P'), badge('J'), badge('M')));
  }
  function telaAplicacaoTrancada() {
    const ap = !!C.apresentacao.liberada;
    return preparo('Parte 3', 'Sua aplicação', 'As fichas das 7 etapas chegam com a parte do mentor já feita: propostas de posicionamento, copy pronta, exemplos de peças e anúncios, tudo adequado ao seu negócio.',
      ap ? 'Mentor preenchendo e adequando a aplicação aos seus dados' : 'Liberada depois da apresentação',
      [['Briefing respondido', '', pctBriefing() >= 100 ? 'feito' : ''],
       ['Apresentação e planejamento estratégico', ap ? 'Liberados.' : 'Em preparação pelo mentor.', ap ? 'feito' : 'agora'],
       ['Mentor preenchendo as fichas e adequando aos seus dados', 'Propostas com o “por que eu indico”, copy, exemplos e anúncios.', ap ? 'agora' : ''],
       ['Aplicação liberada para você', 'Você revisa, aprova ou pede ajustes, e preenche a sua parte.', '']],
      'Você receberá uma mensagem assim que a sua aplicação estiver pronta.');
  }
  function telaEtapa(s) {
    if (!C.aplicacao.liberada) return telaAplicacaoTrancada();
    const i = STAGES.indexOf(s);
    return el('div', {},
      el('div', { class: 'etapa-cab' },
        el('div', { class: 'eyebrow' }, MOVS[s.mov] + ' · ' + s.semana),
        el('h1', {}, el('span', { class: 'num' }, String(s.id).padStart(2, '0') + ' '), s.nome),
        el('p', { class: 'objetivo' }, s.objetivo)),
      el('div', { class: 'legenda' }, 'Quem preenche:', badge('P'), badge('J'), badge('M')),
      el('div', { class: 'barra-geral' }, el('div', { class: 'barra' }, el('div', { id: 'barraEtapa', style: `width:${pct(s)}%` })), el('span', { id: 'pctEtapa' }, pct(s) + '% preenchido')),
      s.mods.map((m, mi) => {
        const d = el('details', { class: 'modulo' },
          el('summary', {}, el('span', { class: 'mod-tit' }, el('span', { class: 'mod-num' }, m.n + ' '), m.nome), el('span', { class: 'mod-pct' }, el('span', { 'data-mod': m.n }, pctDe(chavesMod(m)) + '%'), el('span', { class: 'seta' }, '›'))),
          el('div', { class: 'mod-corpo' },
            el('div', { class: 'teoria' }, el('p', {}, el('b', {}, 'Conceito: '), m.conceito), el('p', {}, el('b', {}, 'Base de estudo: '), m.base)),
            notaModulo(m.n),
            m.fields.map(renderCampo)));
        if (mi === 0) d.open = true;
        return d;
      }),
      el('div', { class: 'acoes' },
        i > 0 ? el('button', { class: 'btn sec', type: 'button', onclick: () => { location.hash = 'etapa-' + STAGES[i - 1].id; } }, '← Etapa anterior') : null,
        el('span', { class: 'espaco' }),
        i < STAGES.length - 1 ? el('button', { class: 'btn', type: 'button', onclick: () => { location.hash = 'etapa-' + STAGES[i + 1].id; } }, 'Próxima etapa →') : el('button', { class: 'btn', type: 'button', onclick: () => { location.hash = 'resumo'; } }, 'Ver resumo →')),
      el('p', { class: 'aviso' }, 'Tudo o que você escreve fica salvo aqui, na sua página.'));
  }
  function telaResumo() {
    return el('div', {},
      el('div', { class: 'etapa-cab' }, el('div', { class: 'eyebrow' }, 'Visão geral'), el('h1', {}, 'Seu caderno completo'),
        el('p', { class: 'objetivo' }, 'Tudo o que você construiu na mentoria, em um só lugar.')),
      el('div', { class: 'res-bloco' }, el('h3', {}, `Briefing (${pctBriefing()}%)`),
        (() => { const ks = chavesBriefing().filter(([k]) => preenchido(k)); return ks.length ? ks.map(([k, l]) => el('p', { class: 'res-linha' }, el('b', {}, l + ' '), mostrar(k))) : el('p', { class: 'res-linha vazio' }, 'Ainda não respondido.'); })()),
      STAGES.map(s => el('div', { class: 'res-bloco' },
        el('h3', {}, `${String(s.id).padStart(2, '0')} · ${s.nome} (${pct(s)}%)`),
        (() => { const ks = chavesEtapa(s).filter(([k]) => preenchido(k)); return ks.length ? ks.map(([k, l]) => el('p', { class: 'res-linha' }, el('b', {}, l + ': '), mostrar(k))) : el('p', { class: 'res-linha vazio' }, 'Ainda não preenchida.'); })())));
  }

  function rota() {
    const h = (location.hash || '').replace('#', '');
    const m = /^etapa-(\d)$/.exec(h);
    const s = m && STAGES.find(x => x.id === Number(m[1]));
    atual = s ? h : (['resumo', 'apresentacao', 'briefing'].includes(h) ? h : 'inicio');
    teclado = null;
    const telas = { resumo: telaResumo, apresentacao: telaApresentacao, briefing: telaBriefing, inicio: telaInicio };
    const main = document.getElementById('main');
    main.classList.toggle('largo', atual === 'apresentacao');
    main.replaceChildren(s ? telaEtapa(s) : telas[atual]());
    const aba = s || atual === 'resumo' ? 'aplicacao' : atual;
    document.querySelectorAll('.aba').forEach(a => a.classList.toggle('on', a.getAttribute('data-aba') === aba));
    document.querySelector('nav.fluxo').hidden = aba !== 'aplicacao' || !C.aplicacao.liberada;
    renderFluxo();
    const ativo = document.querySelector('.no.ativa'); if (ativo) ativo.scrollIntoView({ block: 'nearest', inline: 'center' });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', rota);
  rota();
})();
